<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Reporter Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.5rem; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #64748b; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--primary); ring: 2px solid #bfdbfe; }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; }
        #status { margin-top: 20px; text-align: center; font-size: 0.9rem; padding: 10px; border-radius: 6px; display: none; }
        .success { display: block !important; background: #dcfce7; color: #166534; }
        .error { display: block !important; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 Grade Reporter</h2>
    
    <label>Canvas URL</label>
    <input type="text" id="canvasUrl" placeholder="https://school.instructure.com" value="https://kaneland.instructure.com">

    <label>API Access Token</label>
    <input type="password" id="apiToken" placeholder="Paste your token here">

    <label>Recipient Email</label>
    <input type="email" id="targetEmail" placeholder="your-email@example.com">

    <button id="sendBtn" onclick="generateAndSend()">🚀 Send Grade Report Now</button>
    
    <div id="status"></div>
</div>

<script>
    // 1. INITIALIZE EMAILJS
    // Replace 'YOUR_PUBLIC_KEY' with the one from your EmailJS Account Tab
    emailjs.init("RsAYqiwym2mViUR8u");

    async function generateAndSend() {
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const token = document.getElementById('apiToken').value;
        const targetEmail = document.getElementById('targetEmail').value;
        let canvasUrl = document.getElementById('canvasUrl').value.trim();

        // Basic Validation
        if (!token || !targetEmail) {
            showStatus("Please fill in all fields", "error");
            return;
        }

        // Clean URL to prevent the "pattern" error
        canvasUrl = canvasUrl.replace(/\/$/, ""); 
        
        btn.disabled = true;
        showStatus("Fetching grades from Canvas...", "");

        try {
            // Using a CORS proxy to bypass browser security
            const proxy = "https://cors-anywhere.herokuapp.com/"; 
            const response = await fetch(`${proxy}${canvasUrl}/api/v1/courses?include[]=total_scores&enrollment_state=active`, {
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) throw new Error("Canvas access denied. Check your token.");

            const courses = await response.json();
            let rowsHtml = "";

            courses.forEach(c => {
                if (c.name && c.enrollments) {
                    const score = c.enrollments[0]?.computed_current_score || "N/A";
                    rowsHtml += `<tr><td style="padding:10px;border-bottom:1px solid #eee;">${c.name}</td><td style="padding:10px;border-bottom:1px solid #eee;font-weight:bold;">${score}%</td></tr>`;
                }
            });

            showStatus("Grades found! Sending email...", "");

            // 2. SEND VIA EMAILJS
            // Replace with your Service ID and Template ID
            await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                to_email: targetEmail,
                course_rows: rowsHtml,
                report_date: new Date().toLocaleDateString()
            });

            showStatus("✅ Success! Check your inbox.", "success");
        } catch (err) {
            showStatus("❌ Error: " + err.message, "error");
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(msg, type) {
        const status = document.getElementById('status');
        status.innerText = msg;
        status.className = type;
        status.style.display = msg ? "block" : "none";
    }
</script>

</body>
</html>

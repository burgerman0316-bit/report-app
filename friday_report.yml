name: Send Weekly Grades
on:
  schedule:
    - cron: '0 14 * * 5' # Runs at 14:00 UTC (9:00 AM EST) every Friday
  workflow_dispatch: # This adds a "Run Now" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install axios nodemailer
      - name: Run GradeBot
        env:
          CANVAS_API_KEY: ${{ secrets.CANVAS_API_KEY }}
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: node bot.js
